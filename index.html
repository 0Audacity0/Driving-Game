<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Driving Game</title>
<style>
:root{--bg:#0d0d14;--fg:#ffd84a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:monospace}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:min(100vw,calc((100vh - 20px)*1.6));width:min(100vw,calc((100dvh - 20px)*1.6));height:auto;aspect-ratio:8/5;image-rendering:pixelated;background:#000;touch-action:none}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
.g{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;pointer-events:none}
.L{left:calc(14px + env(safe-area-inset-left,0px));grid-template-columns:repeat(2,92px)}
.R{right:calc(14px + env(safe-area-inset-right,0px));grid-template-columns:repeat(2,84px)}
.L button{height:120px}
#pad button{pointer-events:auto;height:84px;border-radius:18px;font:bold 15px monospace;background:rgba(20,20,30,.55);color:#fff;border:2px solid rgba(255,255,255,.35);touch-action:none;-webkit-user-select:none;user-select:none}
.R .s{height:48px}
.R .nos{height:48px;background:rgba(40,120,255,.5)}
#pad button:active{background:rgba(255,216,74,.5)}
small{opacity:.6;position:fixed;bottom:3px;left:0;right:0;text-align:center;font-size:11px;pointer-events:none}
@media (pointer:coarse){small{display:none}body[data-s=play] #pad{display:block}}
</style></head><body>
<canvas id="c"></canvas>
<div id="pad"><div class="g L"><button data-k="l">◀</button><button data-k="r">▶</button></div><div class="g R"><button class="s" data-k="t">TURN</button><button class="nos" data-k="n">NOS</button><button data-k="d">BRAKE</button><button data-k="u">GAS</button></div></div>
<small>Arrows / WASD drive · Shift nitro · U U-turn · Enter select · M mute</small>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=320,H=200;cv.width=W;cv.height=H;
const step=1/60,segL=200,roadW=2200,fov=100,camH=1000,drawN=240,lanes=3;
const camD=1/Math.tan(fov/2*Math.PI/180),playerZ=camH*camD;
const maxS=segL/step,accel=maxS/5,brake=-maxS,decel=-maxS/5,offDecel=-maxS/2,offLimit=maxS/4,cent=0.3;
const segs=[];let curY=0;
const ease=(a,b,t)=>a+(b-a)*(1-Math.cos(t*Math.PI))/2;
const lerp=(a,b,t)=>a+(b-a)*t;
function add(curve,y){segs.push({n:segs.length,y1:curY,y2:y,curve,cars:[],spr:[],orb:[],rmp:null,ok:false,fin:segs.length<4});curY=y}
function road(e,h,l,curve,dy){
  const sy=curY,ey=sy+dy*segL,tot=e+h+l;
  for(let i=0;i<e;i++)add(ease(0,curve,i/e),ease(sy,ey,i/tot));
  for(let i=0;i<h;i++)add(curve,ease(sy,ey,(e+i)/tot));
  for(let i=0;i<l;i++)add(ease(curve,0,i/l),ease(sy,ey,(e+h+i)/tot));
}
for(let rep=0;rep<3;rep++){
road(40,60,40,0,0);
road(30,40,30,3,0);
road(25,30,25,0,30);
road(25,30,25,-3,-10);
road(20,25,20,5,10);
road(20,20,20,-6,0);
road(30,40,30,0,-20);
road(25,30,25,2,0);
road(25,25,25,0,-curY/segL);}
segs[segs.length-1].y2=0;
const N=segs.length,trackLen=N*segL;
for(const s of segs)s.bio=Math.floor(s.n/(N/3))%3;
for(let n=10;n<N;n+=4){
  const s=segs[n],b=s.bio;
  for(const sd of [-1,1]){
    if(b===2){s.spr.push({ty:3,o:sd*(2+Math.random()*.7),r:Math.random()});if(n%8===2)s.spr.push({ty:4,o:sd*1.12,r:0})}
    else if(Math.random()<.8)s.spr.push({ty:b,o:sd*(1.3+Math.random()*1.6),r:Math.random()});
  }
}
const orbs=[];
for(let n=40;n<N-5;n+=90){
  const lane=[-.66,0,.66][Math.floor(Math.random()*3)],ty=Math.random()<.25?'r':'n';
  for(let i=0;i<3;i++){const orb={o:lane,ty,cd:0};segs[n+i].orb.push(orb);orbs.push(orb)}
}
for(let n=75;n<N-5;n+=140)segs[n].rmp={o:[-.66,0,.66][Math.floor(Math.random()*3)]};
const cols=['#e33','#39f','#fc2','#2c5','#e5e','#fff','#f80'];
const segsM=[];
for(let j=0;j<N;j++){const o=segs[N-1-j];segsM.push({n:j,y1:o.y2,y2:o.y1,curve:-o.curve,cars:[],spr:o.spr.map(t=>({ty:t.ty,r:t.r,o:-t.o})),ok:false,fin:o.fin,bio:o.bio,orb:o.orb,rmp:o.rmp})}
let S=segs,dir=1;
const cars=[];
function spawn(c,far){
  const pz=dir>0?pos+playerZ:trackLen-(pos+playerZ);
  let z;
  do{z=(20+Math.random()*(N-20))*segL;const dd=Math.abs(z-pz);if(!far||Math.min(dd,trackLen-dd)>segL*60)break}while(true);
  c.z=z;c.o=[-.66,0,.66][Math.floor(Math.random()*3)];c.sp=maxS*(.18+Math.random()*.34);c.st=null;c.t=0;
}
function resetCars(){
  cars.length=0;
  for(let i=0;i<90;i++){const c={col:cols[i%cols.length]};spawn(c,false);cars.push(c)}
}
const seg=z=>S[Math.floor((((z%trackLen)+trackLen)%trackLen)/segL)];
let pos=0,px=0,sp=0,hp=100,nos=60,score=0,best=0,state='title',raceMap=0,raceDist=0,raceBots=[],raceWon=false,raceModeActive=false,paused=false,pauseFrom='play',shake=0,skyOff=0,tick=0,tu=0,fade=0,bflash=0,thr=maxS*100/290,tod=.02,mult=1,mt=0,msg='',mg=0,jy=0,vy=0,ot=0,nitOn=false,fogc='#fff';
const k={l:0,r:0,u:0,d:0,n:0};
const CARS=[
 {n:'ROOKIE',p:0,spd:1,hnd:1,nos:1,h:.55},
 {n:'TURBO GT',p:250,spd:1.07,hnd:1.15,nos:1.25,h:.5},
 {n:'VIPER RS',p:625,spd:1.14,hnd:1.3,nos:1.55,h:.47},
 {n:'PHANTOM X',p:1250,spd:1.22,hnd:1.5,nos:2,h:.44},
 {n:'APEX HYPER',p:2250,spd:1.3,hnd:1.75,nos:2.6,h:.4}];
const PAL=['#e22','#2a6df4','#f5c400','#22c55e','#ec4899','#f5f5f5','#222','#ff7a00'];
const STR=[null,'#fff','#111','#ffd84a','#27e6ff'],SN=['NONE','WHITE','BLACK','GOLD','CYAN'];
const GLO=[null,'#27e6ff','#ff3ad0','#7dff3a','#ff4a1a'],GN=['NONE','CYAN','PINK','LIME','FIRE'];
const SPO=['NONE','LOW','WING'];
let money=0,owned=[0],sel=0,look={c:0,s:0,w:1,g:0},viewCar=0,gi=0,mi=0,pm=0,gm='',gt=0,cops=[],heat=0,calm=0,dist=0,nextPay=10000;
function save(){try{localStorage.setItem('roadblaze1',JSON.stringify({money,owned,sel,look,best}))}catch(e){}}
try{const d=JSON.parse(localStorage.getItem('roadblaze1')||'null');if(d){money=d.money|0;owned=d.owned||[0];sel=d.sel|0;Object.assign(look,d.look||{});best=d.best|0;pm=sel}}catch(e){}
function driving(){return state==='play'||state==='race'}
const MAPS=[{name:'SUNSET SPRINT',len:3000,curve:1.0,sky:0,reward:100},{name:'CANYON RUN',len:4000,curve:1.25,sky:1,reward:180},{name:'NEON CIRCUIT',len:5000,curve:1.5,sky:2,reward:300},{name:'MOUNTAIN PASS',len:6000,curve:1.8,sky:3,reward:450},{name:'STORM HIGHWAY',len:7500,curve:2.0,sky:0,reward:650},{name:'BLAZE GRAND PRIX',len:9000,curve:2.3,sky:1,reward:900}];
function beginRace(){reset();state='race';raceModeActive=true;raceDist=0;raceWon=false;raceBots=[];paused=false;say('RACE START');}
function reset(){raceModeActive=false;raceDist=0;raceWon=false;S=segs;dir=1;pos=0;px=0;sp=0;hp=100;nos=60;score=0;mult=1;mt=0;jy=0;vy=0;ot=0;msg='';shake=0;tu=0;fade=0;bflash=0;for(const o of orbs)o.cd=0;cops.length=0;heat=0;calm=0;dist=0;nextPay=10000;pm=sel;resetCars();state='play'}
resetCars();
let ac,osc,og,sir,sg,muted=false;
function audio(){
  if(ac)return;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();og=ac.createGain();
  osc.type='sawtooth';og.gain.value=0;osc.connect(og);og.connect(ac.destination);osc.start();sir=ac.createOscillator();sg=ac.createGain();sir.type='square';sg.gain.value=0;sir.connect(sg);sg.connect(ac.destination);sir.start()}catch(e){ac=null}
}
function bang(){
  if(!ac||muted)return;
  const len=Math.floor(ac.sampleRate*.7),buf=ac.createBuffer(1,len,ac.sampleRate),dd=buf.getChannelData(0);
  for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=ac.createBufferSource(),gn=ac.createGain();gn.gain.value=.6;s.buffer=buf;s.connect(gn);gn.connect(ac.destination);s.start();
}
function start(){audio();if(ac&&ac.state==='suspended')ac.resume();if(!driving())reset()}
const keymap={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',Shift:'n',n:'n',N:'n'};
addEventListener('keydown',e=>{
  if((e.key==='Escape'||e.key==='p'||e.key==='P')&&driving()){paused=!paused;if(paused)pauseFrom=state;else state=pauseFrom;e.preventDefault();return}
  const m=keymap[e.key];
  if(m&&!paused){k[m]=1;e.preventDefault()}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!driving())menu('e')}
  if(paused&&!e.repeat){if(e.key==='Enter'||e.key===' '){paused=false;state=pauseFrom}else if(e.key==='t'||e.key==='T'){paused=false;state='title';k.l=k.r=k.u=k.d=k.n=0}return}
  if(!driving()&&!e.repeat){const mk={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',g:'g',G:'g',Escape:'b'}[e.key];if(mk)menu(mk)}
  if(e.key==='m'||e.key==='M')muted=!muted;
  if(e.key==='u'||e.key==='U')uturn();
});
addEventListener('keyup',e=>{const m=keymap[e.key];if(m)k[m]=0});
document.querySelectorAll('#pad button').forEach(b=>{
  const key=b.dataset.k;
  const press=v=>{k[key]=v;if(v&&key==='t')uturn()};
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.releasePointerCapture(e.pointerId)}catch(_){}press(1)});
  b.addEventListener('pointerenter',e=>{if(e.buttons)press(1)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>{k[key]=0}));
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(driving()&&x>W-31&&y<39){paused=!paused;if(paused)pauseFrom=state;else state=pauseFrom;return}
  if(paused){if(y>90&&y<117){paused=false;state=pauseFrom}else if(y>=118&&y<148){paused=false;state='title';k.l=k.r=k.u=k.d=k.n=0}return}
  if(driving())return;
  if(state==='title'){if(y>96&&y<151){mi=Math.max(0,Math.min(2,Math.floor((y-98)/18)));menu('e')}}
  else if(state==='raceSelect'){const i=Math.floor((y-32)/21);if(i>=0&&i<MAPS.length){raceMap=i;beginRace()}else if(y>175)state='title'}
  else if(state==='garage'){const i=Math.floor((y-97)/13);if(i>=0&&i<6){gi=i;menu(x<W/3?'l':x>W*2/3?'r':'e')}}
  else if(state==='over')menu('e');
});
const ov=(a,aw,b,bw)=>Math.abs(a-b)<(aw+bw);
function say(s){msg=s;mg=110}
function hurt(n,keep){if(!driving())return;hp-=n;shake=Math.max(shake,14);if(!keep){mult=1;mt=0}}
function nearMiss(o){mult=Math.min(8,mult+1);mt=240;score+=(o?200:60)*mult;say((o?'CLOSE CALL x':'NEAR MISS x')+mult)}
function uturn(){if(driving()&&!tu)tu=1}
function flipView(){
  pos=(((trackLen-pos-2*playerZ)%trackLen)+trackLen)%trackLen;
  px=-px;dir=-dir;S=dir>0?segs:segsM;skyOff+=W/2;fade=16;
}
const vz=c=>dir>0?c.z:trackLen-c.z;
function smash(c){
  const vo=dir*c.o,sg=vo===px?(Math.random()<.5?1:-1):Math.sign(vo-px);
  c.st='fly';c.t=0;c.vo=dir*sg*.05;score+=250*mult;shake=22;money+=10;
}
function update(){
  if(paused){if(og)og.gain.value=0;if(sg)sg.gain.value=0;return}
  tick++;
  if(state==='title'||state==='garage'||state==='raceSelect'){pos=(pos+maxS*.22*step)%trackLen;tod=(tod+step/150)%1;sp=maxS*.22;nitOn=false;for(const c of cars)c.z=(c.z+c.sp*step)%trackLen;if(og)og.gain.value=0;if(sg)sg.gain.value=0;return}
  const ps=seg(pos+playerZ),spc=sp/maxS,nit=driving()&&k.n&&nos>0&&!tu,cs=CARS[sel];
  pos+=sp*step;tod=(tod+step/150)%1;
  if(pos>=trackLen)pos-=trackLen;
  const dx=step*2*Math.min(spc,1.2)*cs.hnd;
  if(driving()){
    if(k.l&&!tu)px-=dx;
    if(k.r&&!tu)px+=dx;
    px-=step*2*spc*ps.curve*cent/cs.hnd;
    if(tu){sp+=brake*1.4*step;if(sp<=maxS*.05){sp=0;tu=0;flipView()}}
    else if(k.u||nit)sp+=accel*cs.spd*(nit?2.4:1)*step;else if(k.d)sp+=brake*step;else sp+=decel*step;
    score+=sp*step/50*mult;if(mt>0&&--mt===0)mult=1;if(nit)nos-=.35/cs.nos;else nos=Math.min(100,nos+.02);nitOn=nit;dist+=sp/maxS*290/3.6*step;
    if(state==='race'){
      raceDist+=sp/maxS*290/3.6*step;
      if(raceDist>=MAPS[raceMap].len){raceWon=true;money+=MAPS[raceMap].reward;save();state='over';ot=0;best=Math.max(best,Math.floor(score));say('RACE FINISHED');}
    }
    if(dist>=nextPay){nextPay+=10000;money+=50;save();say('+$50  '+Math.round(dist/1000)+' KM')}
    if(hp<=0){hp=0;tu=0;state='over';ot=0;cops.length=0;best=Math.max(best,Math.floor(score));save();bang(1)}
  }else{sp+=decel*step*2;nitOn=false}
  if((px<-1||px>1)&&sp>offLimit)sp+=offDecel*step;
  px=Math.max(-2.6,Math.min(2.6,px));
  const cap=maxS*cs.spd;if(!nit&&sp>cap)sp-=maxS*.4*step;sp=Math.max(0,Math.min(cap*1.4,sp));
  skyOff-=ps.curve*spc*1.2;
  const a=seg(pos+playerZ),b=S[(a.n+N-1)%N],b2=S[(a.n+N-2)%N];
  for(const s of [a,b,b2])for(const t of s.spr){
    if(jy<6&&ov(px,.18,t.o,.2)&&sp>maxS/6){hurt(12);sp=maxS/6;px+=px>t.o?.15:-.15}
  }
  if(jy>0||vy>0){jy+=vy;vy-=.13;if(jy<=0){jy=0;vy=0;sp*=.96;shake=8}}
  for(const s of [a,b,b2]){
    const r=s.rmp;
    if(r&&jy<=0&&Math.abs(px-dir*r.o)<.3&&sp>maxS*.25){vy=1.2+spc*1.8;jy=.1;score+=100*mult;say('AIRTIME')}
    for(const o of s.orb)if(!o.cd&&jy<12&&Math.abs(px-dir*o.o)<.28){o.cd=1800;score+=25;if(o.ty==='n'){nos=Math.min(100,nos+35);say('NITRO')}else{hp=Math.min(100,hp+25);say('REPAIR +25')}}
  }
  for(const o of orbs)if(o.cd>0)o.cd--;
  for(const c of cars){
    if(c.st){
      c.t++;
      if(c.st==='fly'){
        c.o+=c.vo;
        if(c.t>=34){c.st='boom';c.t=0;c.sp=0;bang();if(Math.abs(vz(c)-(pos+playerZ))<segL*30)bflash=12}
      }else if(c.t>=75){spawn(c,true)}
    }else{
      const dz=((vz(c)-(pos+playerZ))%trackLen+trackLen*1.5)%trackLen-trackLen/2;
      const vv=dir*c.sp,cl=sp-vv;
      const gap=Math.abs(px-dir*c.o);
      if(jy<6&&cl>0&&Math.abs(dz)<70+cl*step&&gap<.2){
        c.nm=1;
        if(vv<0||sp>=thr){smash(c);sp*=.85;hurt(vv<0?30:6,vv>=0)}else{sp=Math.max(0,vv*.5);hurt(10)}
      }else if(!c.nm&&jy<6&&Math.abs(dz)<100+Math.abs(cl)*step&&gap<.42){c.nm=1;nearMiss(vv<0)}
      if(c.nm&&Math.abs(dz)>segL*6)c.nm=0;
    }
    c.z=(c.z+c.sp*step)%trackLen;
  }
  if(mg>0)mg--;for(let i=cars.length-1;i>=0;i--)if(cars[i].dead)cars.splice(i,1);if(state==='over')ot++;
  if(shake>0)shake--;if(bflash>0)bflash--;if(fade>0)fade--;
  if(ac&&og){
    const v=driving()?.04:0;
    og.gain.value=muted?0:v;
    osc.frequency.value=45+spc*150;
  }
}
function pr(wy,wz,camX,camY){
  const cx=-camX,cy=wy-camY,cz=(wz-pos)||.001,sc=camD/cz;
  return{cz,sc,sx:Math.round(W/2+sc*cx*W/2),sy:Math.round(H/2-sc*cy*H/2),sw:Math.round(sc*roadW*W/2)};
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){
  g.fillStyle=c;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.lineTo(x4,y4);g.closePath();g.fill();
}
function tri(x,ay,hw,by,c){g.fillStyle=c;g.beginPath();g.moveTo(x,ay);g.lineTo(x+hw,by);g.lineTo(x-hw,by);g.closePath();g.fill()}
function tree(x,y,w){
  g.fillStyle='#5a3a1a';g.fillRect(x-w*.07,y-w*.5,w*.14,w*.5);
  tri(x,y-w*1.8,w*.5,y-w*.4,'#0a5a14');
  tri(x,y-w*2.3,w*.36,y-w*1.1,'#13802a');
}
function car(x,y,w,col,front,cop,brk){
  const h=w*(brk!==undefined?CARS[pm].h:.55);
  if(brk!==undefined&&GLO[look.g]){const A=g.globalAlpha;g.globalAlpha=A*(.35+.15*Math.sin(tick*.2));g.fillStyle=GLO[look.g];g.fillRect(x-w*.62,y-h*.14,w*1.24,h*.34);g.globalAlpha=A}
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-w*.55,y-h*.1,w*1.1,h*.14);
  g.fillStyle='#111';g.fillRect(x-w*.5,y-h*.42,w*.16,h*.42);g.fillRect(x+w*.34,y-h*.42,w*.16,h*.42);
  g.fillStyle=col;g.fillRect(x-w*.46,y-h*.68,w*.92,h*.42);
  g.fillRect(x-w*.32,y-h,w*.64,h*.36);
  g.fillStyle='#9cf';g.fillRect(x-w*.26,y-h*.94,w*.52,h*.24);
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x-w*.46,y-h*.34,w*.92,h*.1);
  g.fillStyle='rgba(255,255,255,.22)';g.fillRect(x-w*.44,y-h*.66,w*.88,h*.07);
  g.fillStyle='rgba(255,255,255,.4)';g.fillRect(x-w*.21,y-h*.92,w*.1,h*.2);
  g.fillStyle='#181820';g.fillRect(x-w*.46,y-h*.3,w*.92,h*.1);
  g.fillStyle='#ddd';g.fillRect(x-w*.09,y-h*.27,w*.18,h*.06);
  if(brk!==undefined){
    const st=STR[look.s];
    if(st){g.fillStyle=st;g.fillRect(x-w*.16,y-h*.99,w*.1,h*.73);g.fillRect(x+w*.06,y-h*.99,w*.1,h*.73)}
    if(look.w===1){g.fillStyle=col;g.fillRect(x-w*.46,y-h*.76,w*.92,h*.07);g.fillStyle='#111';g.fillRect(x-w*.46,y-h*.7,w*.92,h*.03)}

  if(driving()||state==='over'){g.fillStyle='#333';g.fillRect(6,3,70,4);g.fillStyle=hp<30?'#f33':'#4d4';g.fillRect(6,3,hp*.7,4);g.fillStyle='#333';g.fillRect(6,9,70,3);g.fillStyle=nitOn?'#fff':'#3cf';g.fillRect(6,9,Math.max(0,nos)*.7,3)}
  if(driving()||state==='over')txt(Math.floor(score)+(mult>1?'  x'+mult:''),W/2+14,12,10,mult>1?'#ffd84a':'#fff','center');
  if(driving()||state==='over')txt(Math.round(spc*290)+' KM/H',W-6,12,10,'#6cf','right');
  if(mg>0&&driving())txt(msg,W/2,40,12,'#ffd84a','center');
  if(driving())txt('$'+money+'  '+(dist/1000).toFixed(1)+' KM',6,H-6,9,'#7f7');
   if(state==='race'){
     txt('RACE '+MAPS[raceMap].name,W/2,25,7,'#ffd84a','center');
     txt('PROGRESS '+Math.min(100,Math.floor(raceDist/MAPS[raceMap].len*100))+'%',W/2,34,8,'#fff','center');
     txt('TIME TRIAL',W-5,25,7,'#6cf','right');
   }
  
  if(tu)txt('U-TURN',W/2,70,14,'#fff','center');
  if(dir<0&&driving())txt('BACKWARDS',W-6,H-18,9,'#f8a','right');
  if(bflash>0){g.fillStyle='rgba(255,210,120,'+bflash/24+')';g.fillRect(0,0,W,H)}
  if(fade>0){g.fillStyle='rgba(0,0,0,'+fade/16+')';g.fillRect(0,0,W,H)}
  if(driving()||state==='over'){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(W-24,18,20,17);g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(W-17,22);g.lineTo(W-17,31);g.moveTo(W-11,22);g.lineTo(W-11,31);g.stroke()}
  if(state==='title')drawTitle();else if(state==='garage')drawGarage();else if(state==='raceSelect')drawRaceSelect();
  if(paused){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(35,48,W-70,105);txt('PAUSED',W/2,68,17,'#ffd84a','center');g.fillStyle='#333';g.fillRect(65,81,190,29);g.fillRect(65,116,190,29);txt('KEEP PLAYING',W/2,99,10,'#fff','center');txt('TITLE SCREEN',W/2,134,10,'#fff','center');txt('ESC / P TO RESUME',W/2,164,7,'#aaa','center')}
  if(state==='over'){
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,50,W,100);
    if(state==='title'){
      txt('DRIVING GAME',W/2,88,24,'#ff4a4a','center');
      txt('PRESS ENTER OR TAP TO START',W/2,112,10,'#fff','center');
      txt('NEAR MISSES, NITRO, RAMPS',W/2,130,8,'#ffd84a','center');
    }else{
      txt(raceModeActive?(raceWon?'RACE WON':'RACE FINISHED'):'YOU\'VE CRASHED',W/2,82,18,raceModeActive?'#ffd84a':'#ff4a4a','center');
      txt('SCORE '+Math.floor(score)+'   BEST '+best,W/2,106,10,'#fff','center');
      txt('ENTER RETRY   G GARAGE   ESC MENU',W/2,128,8,'#ffd84a','center');txt('$'+money+'   '+(dist/1000).toFixed(1)+' KM DRIVEN',W/2,142,8,'#7f7','center');
    }
  }
}
let last=performance.now(),acc=0;
function frame(t){
  acc+=Math.min(.25,(t-last)/1000);last=t;
  while(acc>=step){update();acc-=step}
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
